# Staging deployment: builds the production image from Dockerfile.
# Usage: docker compose -f docker-compose.staging.yml up --build -d

name: wg-easy-staging

volumes:
  etc_wireguard_staging:

services:
  wg-easy:
    build:
      context: .
      dockerfile: Dockerfile
    image: wg-easy-staging:local
    container_name: wg-easy-staging
    restart: unless-stopped

    environment:
      INSECURE: "${INSECURE:-true}"
      DISABLE_IPV6: "${DISABLE_IPV6:-false}"
      # Optional first-run initialization:
      # INIT_ENABLED: "true"
      # INIT_HOST: vpn.example.com
      # INIT_PORT: "51820"
      # INIT_USERNAME: admin
      # INIT_PASSWORD: change-me

    volumes:
      - etc_wireguard_staging:/etc/wireguard
      - /lib/modules:/lib/modules:ro

    ports:
      - "51820:51820/udp"
      - "51821:51821/tcp"

    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1

    networks:
      wg_staging:
        ipv4_address: 10.42.43.42
        ipv6_address: fdcc:ad94:bacf:61a4::2a

networks:
  wg_staging:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 10.42.43.0/24
        - subnet: fdcc:ad94:bacf:61a4::/64
